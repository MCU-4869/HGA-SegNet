defaults: 
  - visualization: eval

num_workers: 0
batch_size: 1
cuda: 0
weight_name: "latest" # Used during resume, select with model to load from [miou, macc, acc..., latest]
enable_cudnn: True
#TO ADAPT
#checkpoint_dir specifies path to the directory where the trained model (that should be used for evaluation) and the used configurations are saved,
#e.g. outputs/pumpkin_hga_segnet/pumpkin_hga_segnet-AB-M6-HET-GROWTH-CAUSAL-ACGO-20260101_000000
checkpoint_dir: "outputs/<your_run_dir>"
model_name: AB-M6-HET-GROWTH-CAUSAL-ACGO
precompute_multi_scale: True # Compute multiscate features on cpu for faster training / inference
enable_dropout: False
voting_runs: 1
bn_train_mode_at_eval: True # see conf/config.yaml -- set False for a clean, reproducible eval
scan_bandwidth: 0.9 # scan_threshold.py: fixed bandwidth for the 1D sweeps (growth's optimum)
data:
  #TO ADAPT
  # fold: the PUMPKIN test plots (7 plots of the final split).
  # NOTE: the loader assigns train/val/test from the FILENAME SUFFIX
  # (`_train.ply` / `_val.ply` / `_test.ply`), so the released data MUST carry
  # the split in its filenames -- see splits.csv bundled with the dataset.
  # If your files still use the legacy suffixes, rename them first.
  fold: ['data/treeinsfused/raw/PUMPKIN/PUMPKIN_plot_28_annotated_test.ply',
         'data/treeinsfused/raw/PUMPKIN/PUMPKIN_plot_32_annotated_test.ply',
         'data/treeinsfused/raw/PUMPKIN/PUMPKIN_plot_38_annotated_test.ply',
         'data/treeinsfused/raw/PUMPKIN/PUMPKIN_plot_39_annotated_test.ply',
         'data/treeinsfused/raw/PUMPKIN/PUMPKIN_plot_46_annotated_test.ply',
         'data/treeinsfused/raw/PUMPKIN/PUMPKIN_plot_47_annotated_test.ply',
         'data/treeinsfused/raw/PUMPKIN/PUMPKIN_plot_48_annotated_test.ply']


tracker_options: # Extra options for the tracker
  full_res: True
  make_submission: True
  ply_output: "vote1regular.ply"

hydra:
  run:
    dir: ${checkpoint_dir}/eval/${now:%Y-%m-%d_%H-%M-%S}


